<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BidCheck</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:960px;margin:40px auto;padding:0 20px}input,button{padding:10px;margin:6px 0}button{cursor:pointer}.card{border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.danger{color:#b00}pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px}</style><h1>BidCheck</h1><p>招投标文件风险审查 MVP</p><div class="card"><h2>1. 创建审查项目</h2><input id="project" placeholder="项目ID"><input id="name" placeholder="项目名称"><input id="tender" type="file" accept=".txt,.pdf,.docx,.xlsx"><button onclick="createProject()">上传招标文件</button></div><div class="card"><h2>2. 上传投标响应</h2><input id="pid" placeholder="项目ID"><input id="response" type="file" accept=".txt,.pdf,.docx,.xlsx"><button onclick="uploadResponse()">上传响应文件</button></div><div class="card"><h2>3. 开始审查</h2><input id="aid" placeholder="项目ID"><button onclick="audit()">开始审查</button></div><div class="card"><h2>套餐</h2><button onclick="pricing()">查看 Pricing</button></div><pre id="out">等待操作…</pre><script>const out=x=>document.querySelector('#out').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);async function b64(f){return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.onerror=j;x.readAsDataURL(f)});}async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw x;return x;}async function createProject(){try{const f=document.querySelector('#tender').files[0];const x=await post('/api/v1/projects/upload',{project_id:document.querySelector('#project').value,name:document.querySelector('#name').value,filename:f.name,content_base64:await b64(f)});out(x)}catch(e){out(e)}}async function uploadResponse(){try{const f=document.querySelector('#response').files[0];out(await post('/api/v1/projects/'+document.querySelector('#pid').value+'/responses/upload',{filename:f.name,content_base64:await b64(f)}))}catch(e){out(e)}}async function audit(){try{out(await post('/api/v1/projects/'+document.querySelector('#aid').value+'/audit',{}))}catch(e){out(e)}}async function pricing(){try{const r=await fetch('/api/v1/pricing');out(await r.json())}catch(e){out(e)}}</script></html>
